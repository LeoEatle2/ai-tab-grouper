<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 300px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #202124;
      margin: 0;
    }
    label {
      display: block;
      font-weight: 600;
      margin: 8px 0 4px;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      font-size: 12px;
      background: #fff;
    }
    .model-tools {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-top: 6px;
      color: #5f6368;
      font-size: 12px;
    }
    #refreshModels {
      flex: none;
      padding: 4px;
      color: #1a73e8;
      background: transparent;
      font-size: 12px;
    }
    #refreshModels:disabled {
      color: #5f6368;
      cursor: default;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    #groupBtn {
      background: #1a73e8;
      color: #fff;
    }
    #groupBtn:disabled {
      background: #9bbef5;
      cursor: not-allowed;
    }
    #ungroupBtn {
      background: #f1f3f4;
      color: #3c4043;
      flex: 0.55;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #5f6368;
      word-break: break-all;
    }
    [hidden] {
      display: none !important;
    }
    details {
      margin-top: 8px;
      border-top: 1px solid #e4e7eb;
      padding-top: 8px;
    }
    summary {
      cursor: pointer;
      font-weight: 600;
    }
    pre {
      max-height: 120px;
      overflow: auto;
      margin: 6px 0 0;
      padding: 8px;
      border-radius: 6px;
      background: #f1f3f4;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
      line-height: 1.5;
    }
    #copyLogs {
      margin-top: 6px;
      padding: 4px 6px;
      color: #1a73e8;
      background: transparent;
      font-size: 12px;
    }
    #copyStatus {
      margin-left: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <label for="baseUrl">API Base URL（不含 /chat/completions）</label>
  <input id="baseUrl" type="text" placeholder="https://openrouter.ai/api/v1" />

  <label for="apiKey">API Key</label>
  <input id="apiKey" type="password" placeholder="sk-..." />

  <label for="modelPreset">选择模型</label>
  <select id="modelPreset" aria-describedby="modelStatus" disabled>
    <option value="" selected disabled>正在读取 API 配置…</option>
  </select>
  <div class="model-tools">
    <button id="refreshModels" type="button" disabled>刷新可用模型</button>
    <span id="modelStatus" role="status"></span>
  </div>

  <div class="actions">
    <button id="groupBtn">一键智能分组</button>
    <button id="ungroupBtn">解散分组</button>
  </div>
  <div id="status" role="status"></div>
  <section id="modelDetails" hidden>
    <details>
      <summary id="reasoningLabel">模型思考</summary>
      <pre id="reasoning" tabindex="0"></pre>
    </details>
    <details open>
      <summary>模型输出</summary>
      <pre id="modelOutput" tabindex="0"></pre>
    </details>
  </section>
  <details id="logDetails" hidden>
    <summary>排查日志</summary>
    <pre id="logs" tabindex="0"></pre>
    <button id="copyLogs" type="button">复制日志</button>
    <span id="copyStatus" role="status"></span>
  </details>

  <script src="popup.js"></script>
</body>
</html>
